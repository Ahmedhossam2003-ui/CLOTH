apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloth-backend
  namespace: cloth-app
  labels:
    app: cloth-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloth-backend
  template:
    metadata:
      labels:
        app: cloth-backend
    spec:
      containers:
      - name: backend
        image: backend-cloth:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        env:
        - name: MONGO_URI
          value: "mongodb://mongo-service:27017/cloth-db"
        - name: PORT
          value: "5000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/cloth
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
       