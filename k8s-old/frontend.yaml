apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloth-frontend
  namespace: cloth-app
  labels:
    app: cloth-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloth-frontend
  template:
    metadata:
      labels:
        app: cloth-frontend
    spec:
      containers:
      - name: frontend
        image: frontend-cloth:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/cloth
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
       