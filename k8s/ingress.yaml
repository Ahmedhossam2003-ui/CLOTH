apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloth-ingress
  namespace: cloth-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backservice
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontservice
            port:
              number: 3000